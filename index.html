  </head>

    <svg hidden aria-hidden="true">
      <symbol id="icon-alert" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" />
        <path d="M12 8v4m0 4h.01" />
      </symbol>
      <symbol id="icon-glasses" viewBox="0 0 24 24">
        <circle cx="6" cy="15" r="4" />
        <circle cx="18" cy="15" r="4" />
        <path d="M14 15a2 2 0 0 0-2-2 2 2 0 0 0-2 2 M2.5 13 5 7c.7-1.3 1.4-2 3-2 M21.5 13 19 7c-.7-1.3-1.5-2-3-2" />
      </symbol>
      <symbol id="icon-maximize" viewBox="0 0 24 24">
        <path d="M8 3H5a2 2 0 0 0-2 2v3 M21 8V5a2 2 0 0 0-2-2h-3 M3 16v3a2 2 0 0 0 2 2h3 M16 21h3a2 2 0 0 0 2-2v-3" />
      </symbol>
      <symbol id="icon-refresh" viewBox="0 0 24 24">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8 M21 3v5h-5 M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16 M8 16H3v5" />
      </symbol>
      <symbol id="icon-close" viewBox="0 0 24 24">
        <path d="M18 6 6 18 M6 6l12 12" />
      </symbol>
    </svg>
    <div class="app">
      <main class="boot">
        <h1>Loading library…</h1>
        <p role="alert" hidden></p>
        <button type="button" class="control-button" hidden>
          <svg width="16" height="16" aria-hidden="true"><use href="#icon-refresh" /></svg>Retry
        </button>
      </main>
    </div>
    <template id="workspace">
      <main class="stage">
        <p class="stage-error" role="alert" hidden>Could not start the workspace. WebGL 2 is required.</p>
      </main>
      <div class="app-actions">
        <button id="fit-all" type="button" class="control-button" disabled>
          <svg width="16" height="16" aria-hidden="true"><use href="#icon-maximize" /></svg>Fit all
        </button>
        <button id="vr-mode" type="button" class="control-button" role="switch" aria-checked="false" disabled>
          <svg width="18" height="18" aria-hidden="true"><use href="#icon-glasses" /></svg>VR mode
        </button>
      </div>
      <div class="app-notices">
        <div id="storage-error" class="app-notice" role="alert" hidden>
          <svg width="18" height="18" aria-hidden="true"><use href="#icon-alert" /></svg>Autosave unavailable
        </div>
        <div id="vr-error" class="app-notice" role="alert" hidden>
          <svg width="18" height="18" aria-hidden="true"><use href="#icon-alert" /></svg><span></span>
          <button type="button" class="icon-button" aria-label="Dismiss notification">
            <svg width="15" height="15" aria-hidden="true"><use href="#icon-close" /></svg>
          </button>
        </div>
      </div>
    </template>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
